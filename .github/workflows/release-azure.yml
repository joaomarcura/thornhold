name: Release Azure Container Apps

on:
  workflow_dispatch:
    inputs:
      min_replicas:
        description: '0 is cheapest; 1 avoids cold starts'
        required: true
        default: '0'
        type: choice
        options: ['0', '1']
  push:
    tags: ['v*']

concurrency:
  group: thornhold-azure-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  MIN_REPLICAS: ${{ inputs.min_replicas || '0' }}

jobs:
  validate-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate required deployment configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.AZURE_CONTAINER_APP }}
          ACR_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY }}
        run: |
          for NAME in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID RESOURCE_GROUP APP_NAME ACR_NAME; do
            test -n "${!NAME}" || { echo "Missing GitHub production setting: $NAME"; exit 1; }
          done
      - run: npm ci
      - run: npm run release:check
      - name: Real WebSocket multi-room load gate
        run: npm run test:load
        env:
          LOAD_ROOMS: 8
          LOAD_CLIENTS_PER_ROOM: 6
          LOAD_SECONDS: 10
          LOAD_SPEED: 1
          LOAD_P95_LIMIT_MS: 25
      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --upgrade
      - name: Login to ACR
        env:
          ACR_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY }}
        run: az acr login --name "$ACR_NAME"
      - name: Build and push immutable image
        env:
          ACR_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY }}
        run: |
          IMAGE="$ACR_NAME.azurecr.io/thornhold:$GITHUB_SHA"
          docker build --build-arg BUILD_SHA="$GITHUB_SHA" --label org.opencontainers.image.revision="$GITHUB_SHA" -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Capture current image for rollback
        id: previous
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.AZURE_CONTAINER_APP }}
        run: |
          PREVIOUS=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --query 'properties.template.containers[0].image' --output tsv 2>/dev/null || true)
          echo "image=$PREVIOUS" >> "$GITHUB_OUTPUT"
      - name: Deploy revision with hard scale limit
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.AZURE_CONTAINER_APP }}
          ACR_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY }}
        run: |
          IMAGE="$ACR_NAME.azurecr.io/thornhold:$GITHUB_SHA"
          az containerapp update --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --image "$IMAGE" --min-replicas "$MIN_REPLICAS" --max-replicas 1
      - name: Verify public health endpoint
        id: health
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.AZURE_CONTAINER_APP }}
        run: |
          FQDN=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --query 'properties.configuration.ingress.fqdn' --output tsv)
          for ATTEMPT in $(seq 1 30); do
            if curl --fail --silent --show-error "https://$FQDN/health"; then echo "url=https://$FQDN" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 5
          done
          exit 1
      - name: Verify real WebSocket lobby and 1x5 match
        id: smoke
        run: npm run test:remote
        env:
          REMOTE_URL: ${{ steps.health.outputs.url }}
      - name: Roll back image after failed health check
        if: failure() && (steps.health.outcome == 'failure' || steps.smoke.outcome == 'failure') && steps.previous.outputs.image != ''
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.AZURE_CONTAINER_APP }}
          PREVIOUS_IMAGE: ${{ steps.previous.outputs.image }}
        run: az containerapp update --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --image "$PREVIOUS_IMAGE"
